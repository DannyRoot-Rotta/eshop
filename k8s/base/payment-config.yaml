apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-config
data:
  OTEL_SERVICE_NAME: payment-service
  LOG_LEVEL: info
  DB_HOST: payment-db
  DB_PORT: "5432"
  KAFKA_BOOTSTRAP: kafka:9092
  KAFKA_GROUP: payment-service
  RELAY_ENABLED: "true"
  PAYMENT_LIMIT_CENTS: "50000"
  PAYMENT_DELAY_MS: "0"
  MAX_ATTEMPTS: "3"
  RETRY_BASE_MS: "200"
  RETRY_CAP_MS: "5000"
