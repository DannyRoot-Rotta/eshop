apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: payment-service
  labels:
    app: payment-service
    app.kubernetes.io/part-of: eshop
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: payment-service
  labels:
    app: payment-service
    app.kubernetes.io/part-of: eshop
spec:
  source:
    type: Git
    git:
      uri: https://github.com/DannyRoot-Rotta/eshop
      ref: main
    contextDir: payment-service
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: ImageStreamTag
        namespace: openshift
        name: nodejs:22-ubi9
  output:
    to:
      kind: ImageStreamTag
      name: payment-service:latest
  triggers:
    - type: ConfigChange
