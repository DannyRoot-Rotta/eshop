apiVersion: v1
kind: ServiceAccount
metadata:
  name: riconciliatore
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: riconciliatore-edit
subjects:
  - kind: ServiceAccount
    name: riconciliatore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: riconciliatore
  labels:
    app.kubernetes.io/part-of: eshop
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 240
      template:
        spec:
          serviceAccountName: riconciliatore
          restartPolicy: Never
          volumes:
            - name: work
              emptyDir: {}
          initContainers:
            - name: git
              image: registry.access.redhat.com/ubi9/nodejs-22:latest
              env:
                - name: GIT_URL
                  value: https://github.com/DannyRoot-Rotta/eshop
                - name: GIT_REF
                  value: main
                - name: HOME
                  value: /tmp
              command: [bash, -c]
              args:
                - git clone --quiet --depth 1 --branch "$GIT_REF" "$GIT_URL" /work/repo &&
                  echo "commit: $(git -C /work/repo rev-parse --short HEAD)"
              volumeMounts:
                - name: work
                  mountPath: /work
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
          containers:
            - name: apply
              image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
              command: [bash, -c]
              args:
                - oc apply -k /work/repo/k8s/overlays/sandbox
              volumeMounts:
                - name: work
                  mountPath: /work
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
